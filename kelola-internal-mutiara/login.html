<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Pengurus - Yayasan Mutiara Ilmu</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              green: '#0B4D3C',
              'green-dark': '#062F24',
              gold: '#F59E0B',
              'gold-hover': '#D97706',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-gradient-to-br from-[#062F24] via-[#0B4D3C] to-[#073529] min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 sm:p-10 border border-emerald-100 relative">
    
    <!-- Logo & Title -->
    <div class="text-center mb-8">
      <div class="w-20 h-20 mx-auto mb-3 rounded-full overflow-hidden shadow-md border-2 border-emerald-500">
        <img src="../assets/images/Logo.jpg" alt="Logo Yayasan Mutiara Ilmu" class="w-full h-full object-cover">
      </div>
      <h1 class="text-xl sm:text-2xl font-extrabold text-[#0B4D3C] tracking-tight">
        PORTAL PENGURUS
      </h1>
      <p class="text-xs font-semibold text-[#F59E0B] tracking-wider uppercase mt-0.5">
        Yayasan Mutiara Ilmu
      </p>
      <p class="text-xs text-slate-500 mt-2">
        Masuk untuk memperbarui cerita santri, foto kegiatan, dan informasi yayasan.
      </p>
    </div>

    <!-- Alert Message Box -->
    <div id="login-alert" class="hidden mb-4 p-3 rounded-xl text-xs font-medium bg-red-50 text-red-700 border border-red-200"></div>

    <!-- Login Form -->
    <form id="admin-login-form" class="space-y-4">
      <div>
        <label for="email" class="block text-xs font-bold text-slate-700 mb-1">Email Pengurus</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
            <i data-lucide="mail" class="w-4 h-4"></i>
          </span>
          <input 
            type="email" 
            id="email" 
            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#0B4D3C] focus:border-transparent transition"
            placeholder="admin@mutiarailmu.or.id" 
            value="admin@mutiarailmu.or.id"
            required
          >
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-bold text-slate-700 mb-1">Kata Sandi</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </span>
          <input 
            type="password" 
            id="password" 
            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#0B4D3C] focus:border-transparent transition"
            placeholder="••••••••" 
            value="admin123"
            required
          >
        </div>
      </div>

      <!-- Demo Info Box -->
      <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-200/70 text-[11px] text-[#0B4D3C]">
        <p class="font-bold flex items-center gap-1">
          <i data-lucide="info" class="w-3.5 h-3.5 text-[#F59E0B]"></i> Akun Demo Siap Pakai:
        </p>
        <p class="text-slate-600 mt-0.5">Email: <code>admin@mutiarailmu.or.id</code> | Sandi: <code>admin123</code></p>
      </div>

      <button 
        type="submit" 
        class="w-full py-3 rounded-full bg-[#0B4D3C] hover:bg-[#062F24] text-white font-bold text-sm shadow-md transition flex items-center justify-center gap-2 mt-4"
      >
        <i data-lucide="log-in" class="w-4 h-4 text-[#FBBF24]"></i>
        <span>Masuk ke Dashboard</span>
      </button>
    </form>

    <div class="text-center mt-6 pt-4 border-t border-slate-100">
      <a href="../index.html" class="text-xs font-semibold text-slate-500 hover:text-[#0B4D3C] transition flex items-center justify-center gap-1">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Kembali ke Website Utama
      </a>
    </div>

  </div>

  <script>
    lucide.createIcons();

    document.getElementById("admin-login-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const pass = document.getElementById("password").value.trim();
      const alertBox = document.getElementById("login-alert");

      // Verify credentials
      if ((email === "admin@mutiarailmu.or.id" && pass === "admin123") || (email.length > 3 && pass.length >= 6)) {
        // Save session
        sessionStorage.setItem("mutiara_admin_session", JSON.stringify({
          email: email,
          name: "Pengurus Yayasan Mutiara Ilmu",
          loggedInAt: new Date().toISOString()
        }));
        window.location.href = "index.html";
      } else {
        alertBox.classList.remove("hidden");
        alertBox.textContent = "Email atau kata sandi tidak valid. Gunakan admin@mutiarailmu.or.id / admin123";
      }
    });
  </script>
</body>
</html>
